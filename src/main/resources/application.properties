server.port=8085

spring.datasource.url=jdbc:h2:mem:requestsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.datasource.platform=h2
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/${spring.datasource.platform}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.apache=DEBUG
logging.level.br.mf.demospringsecurity=DEBUG

jwt.secret=0123456789abcdef0123456789abcdef
jwt.expiration=21600000